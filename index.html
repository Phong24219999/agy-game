<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Abyss Descent - Auto-Battler Roguelite</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }
    body {
      background-color: #0b0a10;
      color: #e2d9f3;
      font-family: 'Cinzel', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100vw;
      height: 100vh;
    }
    #game-container {
      position: relative;
      width: 960px;
      height: 600px;
      max-width: 100vw;
      max-height: 100vh;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.9), 0 0 15px rgba(120, 50, 180, 0.3);
      border: 2px solid #2a203a;
      border-radius: 8px;
      background: #0d0c14;
      overflow: hidden;
    }
    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <div id="game-container"></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
